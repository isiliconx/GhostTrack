[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosttrack-collective"
version = "3.0.0"
description = "Public IP, offline phone metadata and evidence-aware username lookups"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "HunxByts (original project)"}, {name = "isiliconx (collective fork)"}]
dependencies = ["requests>=2.32.3,<3", "phonenumbers>=9,<10"]

[project.urls]
Repository = "https://github.com/isiliconx/GhostTrack"
Upstream = "https://github.com/HunxByts/GhostTrack"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
ghosttrack = "ghosttrack.cli:main"

[tool.setuptools.packages.find]
include = ["ghosttrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
